<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>모달 팝업 예제</title>
  <style>
    /* 팝업 배경 */
    .modal {
      display: none; /* 기본은 숨김 */
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
    }

    /* 팝업 내용 */
    .modal-content {
      background-color: #fff;
      margin: 15% auto;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      position: relative;
    }

    /* 닫기 버튼 */
    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover {
      color: black;
    }
  </style>
</head>
<body>




  <!-- 팝업 구조 -->
  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <p id="output"></p>

      <script>
        document.getElementById('busnum').addEventListener('input', function() {
            const inputValue = document.getElementById('busnum').value;
            document.getElementById('output').textContent= "입력한 버스 ["+ inputValue + "] 번의 예약이 완료되었습니다!"
        });
      </script>
    </div>
  </div>

  <script>
    // 팝업 열기/닫기 기능
    const modal = document.getElementById("myModal");
    const btn = document.getElementById("예약완료");
    const span = document.querySelector(".close");

    btn.onclick = function() {
      modal.style.display = "block";
    }

    span.onclick = function() {
      modal.style.display = "none";
    }

    window.onclick = function(event) {
      if (event.target == modal) {
        modal.style.display = "none";
      }
    }
  </script>

</body>
</html>
